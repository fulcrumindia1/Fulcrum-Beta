services:
  fulcrum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fulcrum-app
    restart: unless-stopped
    environment:
      - DATA_BACKEND=supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - SOLE_ADMIN_UUID=${SOLE_ADMIN_UUID:-}
      - DOMAIN=${DOMAIN:-app.fulcrumindia.online}
      - APP_URL=${APP_URL:-https://${DOMAIN:-app.fulcrumindia.online}}
    networks:
      - fulcrum-net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.75'
          memory: 5G
        reservations:
          cpus: '0.25'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: fulcrum-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-app.fulcrumindia.online}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - fulcrum-net
    depends_on:
      fulcrum:
        condition: service_healthy

networks:
  fulcrum-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "sans serif"

[server]
runOnSave = false
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 5

[client]
toolbarMode = "minimal"
showErrorDetails = false
